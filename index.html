
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sarwar AI</title>
<style>
*{box-sizing:border-box}
body{
margin:0;background:#0b1020;color:white;
font-family:Arial,sans-serif;
}
header{
padding:22px;background:#151d32;
display:flex;justify-content:space-between;
align-items:center;border-bottom:1px solid #293653;
}
.logo{font-size:25px;font-weight:bold;color:#65d6a5}
button{
border:0;border-radius:12px;padding:13px;
background:#42c98b;color:#071b14;
font-weight:bold;cursor:pointer;
}
main{max-width:750px;margin:auto;padding:20px}
.welcome{text-align:center;margin:55px 0 35px}
.welcome h1{font-size:32px;color:#65d6a5}
.welcome p{color:#aab5ce}
#chat{
display:flex;flex-direction:column;gap:14px;
padding-bottom:110px;
}
.message{
padding:15px;border-radius:15px;
max-width:90%;line-height:1.8;
white-space:pre-wrap;
}
.user{background:#245b50;align-self:flex-start}
.ai{background:#1b2942;align-self:flex-end}
.bottom{
position:fixed;bottom:0;left:0;right:0;
padding:14px;background:#111a2d;
display:flex;gap:9px;
}
input{
flex:1;min-width:0;padding:15px;
border-radius:12px;border:1px solid #40506c;
background:#202b40;color:white;font-size:16px;
}
#send{min-width:65px}
</style>
</head>
<body>
<header>
<div class="logo">✦ Sarwar AI</div>
<button onclick="toggleLang()">فارسی / English</button>
</header>
<main>
<div class="welcome">
<h1>Welcome to Sarwar AI</h1>
<p>دستیار هوشمند شما برای یادگیری و پیشرفت</p>
</div>
<div id="chat">
<div class="message ai">
سلام! به سرور AI خوش آمدید.
من آماده کمک به شما هستم. چه سؤالی دارید؟
</div>
</div>
</main>
<div class="bottom">
<input id="msg" placeholder="پیام خود را بنویسید..." />
<button id="send" onclick="sendMessage()">ارسال</button>
</div>
<script>
let english=false;
function toggleLang(){
english=!english;
document.documentElement.lang=english?"en":"fa";
document.documentElement.dir=english?"ltr":"rtl";
document.querySelector(".welcome h1").textContent=
english?"Welcome to Sarwar AI":"به سرور AI خوش آمدید";
document.getElementById("msg").placeholder=
english?"Write your message...":"پیام خود را بنویسید...";
}
function addMessage(text,type){
const div=document.createElement("div");
div.className="message "+type;
div.textContent=text;
document.getElementById("chat").appendChild(div);
window.scrollTo(0,document.body.scrollHeight);
}
async function sendMessage(){
const input=document.getElementById("msg");
const message=input.value.trim();
if(!message)return;
addMessage(message,"user");
input.value="";
try{
const response=await fetch("/api/chat",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({message})
});
if(!response.ok)throw new Error("API error");
const data=await response.json();
addMessage(data.reply,"ai");
}catch(error){
addMessage("اتصال هوش مصنوعی هنوز فعال نشده است. باید بخش امن API را نیز راه‌اندازی کنیم.","ai");
}
}
document.getElementById("msg").addEventListener("keydown",e=>{
if(e.key==="Enter")sendMessage();
});
</script>
</body>
</html>
